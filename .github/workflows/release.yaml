name: Release

# Tag vX.Y.Z to release. The tagged commit must pass CI; then the multi-arch images are published to
# Docker Hub (fonoster/roomr and fonoster/roomr-fake, X.Y.Z and :latest for a stable tag), the npm
# package @fonoster/roomr is published at X.Y.Z, and a GitHub release is created with generated
# notes, the protos (platforms vendor them from here) and static roomr-fake binaries.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  images:
    name: publish fonoster/${{ matrix.image.name }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: roomr, target: node }
          - { name: roomr-fake, target: fake }
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release tag (v0.1.0-rc.1) does not move :latest.
          case "$VERSION" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "fonoster/${{ matrix.image.name }}:${{ steps.v.outputs.version }}"
            [ "${{ steps.v.outputs.latest }}" != "true" ] || echo "fonoster/${{ matrix.image.name }}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image.name }}

  npm:
    name: publish @fonoster/roomr
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later (Node 22 ships npm 10).
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      # Trusted publishing: npm verifies this run (id-token), so no npm token is stored. The
      # package's trusted publisher on npmjs.com is fonoster/roomr, release.yaml.
      - name: Publish (a pre-release goes to the next tag)
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac
          npm publish --access public --provenance --tag "$TAG"

  # Not after npm: the images, protos and binaries ship even when the npm publish fails.
  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Static roomr-fake binaries (no cgo: the fake's nodes offer every codec but Opus), for
      # running the fake without Docker (macOS development).
      - name: Build roomr-fake binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "dist/roomr-fake-$os-$arch" ./cmd/roomr-fake
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --generate-notes --title "$GITHUB_REF_NAME" \
            api/roomr/v1/roomr.proto api/session/v1/session.proto dist/roomr-fake-*
