name: Release

# Tag vX.Y.Z to release. The tagged commit must pass CI; then the multi-arch image is published to
# Docker Hub (fonoster/roomr:X.Y.Z, and :latest for a stable tag) and a GitHub release is created
# with generated notes and the protos attached (Fonoster vendors them from here).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  images:
    name: publish fonoster/${{ matrix.image.name }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: roomr, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release tag (v0.1.0-rc.1) does not move :latest.
          case "$VERSION" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "fonoster/${{ matrix.image.name }}:${{ steps.v.outputs.version }}"
            [ "${{ steps.v.outputs.latest }}" != "true" ] || echo "fonoster/${{ matrix.image.name }}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image.name }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --generate-notes --title "$GITHUB_REF_NAME" \
            api/roomr/v1/roomr.proto api/session/v1/session.proto
