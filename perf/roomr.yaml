# Roomr on the UUT. ${PERFKIT_UUT_IP} is expanded by the node's config loader. No NATS runs on
# the UUT: the node keeps calls going without it (best effort).
nodeId: bench
sip:
  listen: 0.0.0.0:5060
  advertise: ${PERFKIT_UUT_IP}
rtp:
  host: 0.0.0.0
  advertise: ${PERFKIT_UUT_IP}
  portMin: 20000
  portMax: 40000
control:
  grpc:
    listen: 127.0.0.1:50061
sessionEndpoint: 127.0.0.1:50071
maxRooms: 10000   # the ramp, not a room cap, finds the limit
