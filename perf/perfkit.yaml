apiVersion: perfkit/v1
project:
  name: Roomr
  repo: fonoster/roomr
  siteUrl: https://github.com/fonoster/roomr/tree/main/perf/runs
  accent: "#5FCFCE"
  title: How many calls and rooms a Roomr node handles.
  lead: Roomr on two dedicated cores, the spec's capacity bar, driven by SIPp from a second server.
infra:
  provider: digitalocean
  region: nyc3
  uut: { size: c-4 }
  loadgen: { size: c-8 }
  maxLifetime: 9h
images:
  roomr: fonoster/roomr
benchmarks:
  - id: invite-answer
    kind: capacity
    title: Call setup at a 2 s hold
    narrative:
      what: Inbound calls answered by an app over the control stream, each held 2 s.
      why: Every call pays this cost; when it saturates, callers wait or fail.
      how: "SIPp ramps INVITEs from 10 to 300 calls/s, 10 more every minute, each call held 2 s, so about twice the rate is mixing audio at once. It stops at the first step where p99 INVITE-to-200 reaches 200 ms or failed calls reach 0.1%."
    uut:
      compose: compose.yaml
      processes:                  # the sampler's command line starts with a space
        - { name: roomr, match: "(^| )/roomr( |$)" }
        - { name: app, match: "(^| )/usr/local/bin/perf-app( |$)" }   # its CPU shows when the app, not Roomr, is the limit
    load:
      tool: sipp
      transport: udp
      uac: { scenario: invite-answer/uac_invite.xml }
      hold: 2s
      rate: { start: 10, step: 10, every: 60s, max: 300 }
    warmup: 10s
    thresholds: { p99LatencyMs: 200, failedCallsPct: 0.1 }
  - id: rooms-g711
    kind: soak
    title: G.711 rooms, six hours
    narrative:
      what: Rooms of one G.711 caller and one app participant, mixing audio both ways.
      why: Leaks only show after hours.
      how: "SIPp holds about 200 concurrent rooms (3.34 calls/s, 60 s each, PCMU RTP) for six hours. After a 30-minute warm-up, memory may grow at most 5 MB/h."
    duration: 6h
    warmup: 30m                   # longer than the node keeps ended calls (10 min), so memory has levelled off
    uut:
      compose: compose.yaml
      processes:
        - { name: roomr, match: "(^| )/roomr( |$)" }   # not the app: the soak judges each process's memory
    load:
      tool: sipp
      transport: udp
      uac: { scenario: rooms-g711/uac_invite.xml }
      hold: 60s
      rate: { cps: 3.34 }
    thresholds: { memoryGrowthMBPerHour: 5, failedCallsPct: 0.1, restarts: 0 }
