# Roomr and the app that answers its calls, on the UUT. perfkit sets the PERFKIT_* variables.
# Host networking only: perfkit refuses a service without it.
services:
  app:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    network_mode: host
    restart: "no"
    cpuset: "2,3"
    working_dir: /src
    # The app's source, read-only; the binary goes to /usr/local/bin, so nothing lands in perf/.
    volumes:
      - ./app:/src:ro
    command: ["sh", "-c", "go build -o /usr/local/bin/perf-app . && exec /usr/local/bin/perf-app"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50071"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 120s

  roomr:
    image: ${PERFKIT_IMAGE_ROOMR:?set PERFKIT_IMAGE_ROOMR}
    network_mode: host
    restart: "no"
    cpuset: "0,1"   # the spec's 2 vCPU capacity bar
    depends_on:
      app: { condition: service_healthy }
    environment:
      PERFKIT_UUT_IP: ${PERFKIT_UUT_IP:?set PERFKIT_UUT_IP}
    volumes:
      - ./roomr.yaml:/config/roomr.yaml:ro
